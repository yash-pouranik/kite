events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream to isolated Juice Shop application container
    upstream backend_target {
        server juice-shop:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # ----------------------------------------------------------------------
        # DYNAMIC VIRTUAL PATCHES MOUNT
        # Any .conf file dropped in /etc/nginx/conf.d/ is dynamically evaluated.
        # Fix Engine injects targeted regex filters here with zero downtime!
        # ----------------------------------------------------------------------
        include /etc/nginx/conf.d/*.conf;

        # Default reverse proxy pass-through to vulnerable application
        location / {
            proxy_pass http://backend_target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
