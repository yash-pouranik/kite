services:
  # ── Core Gateway, Switch Protocol & Multi-Agent Discord Runtime ──
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: kite-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME}
      - HOST_REPO_PATH=${HOST_REPO_PATH:-./target_repo}
      - TARGET_HOST=${TARGET_HOST:-target-app}
      - K8S_NAMESPACE=${K8S_NAMESPACE:-default}
      - SWITCH_SERVER_URL=${SWITCH_SERVER_URL:-http://switch-server:8000}
      - SWITCH_AGENT_REGISTRATION_TOKEN=${SWITCH_AGENT_REGISTRATION_TOKEN:-secops-switch-token-2026}
      - SWITCH_AGENT_ID=${SWITCH_AGENT_ID:-kite-secops}
      - SWITCH_ROOM_ID=${SWITCH_ROOM_ID:-cyberwar-ops}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://secops:secops_secure_pass@postgres:5432/cyberwar
    volumes:
      # Live sync gateway code on host git pull
      - ./gateway:/app
      # Host source code repo mount (for native git commands on target repo)
      - ${HOST_REPO_PATH:-./target_repo}:/app/target_repo
      - /var/run/docker.sock:/var/run/docker.sock
      # Kubernetes cluster credentials mount (read-only for kubectl pod forensics)
      - ${HOST_KUBE_DIR:-~/.kube}:/root/.kube:ro
      - /etc/rancher/k3s:/etc/rancher/k3s:ro
    depends_on:
      - redis
      - postgres
      - sec-tools
      - switch-server
    networks:
      - secops-net

  # ── PostgreSQL Persistent State ──
  postgres:
    image: postgres:16-alpine
    container_name: kite-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=secops
      - POSTGRES_PASSWORD=secops_secure_pass
      - POSTGRES_DB=cyberwar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secops -d cyberwar"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./gateway/db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    networks:
      - secops-net

  # ── Redis Ephemeral State ──
  redis:
    image: redis:7-alpine
    container_name: kite-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - secops-net

  # ── Sandboxed Security Tools (Nmap + Nuclei CLI) ──
  sec-tools:
    build:
      context: ./sandbox/tools
      dockerfile: Dockerfile.tools
    container_name: kite-sec-tools
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      - secops-net

  # ── Official Switch Server (Switch Rooms & Agent Bridge) ──
  switch-server:
    image: ${SWITCH_SERVER_IMAGE:-ghcr.io/sandbox-quantum/switch-core:latest}
    container_name: kite-switch-server
    restart: unless-stopped
    ports:
      - "8080:8000"
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=secops
      - DB_PASSWORD=secops_secure_pass
      - DB_OWNER_USER=secops
      - DB_OWNER_PASSWORD=secops_secure_pass
      - DB_NAME=cyberwar
      - DB_REQUIRE_RESTRICTED_ROLE=false
      - ID_SERVER_NAME=localhost
      - MATRIX_SERVER_NAME=localhost
      - AGENT_REGISTRATION_TOKEN=${SWITCH_AGENT_REGISTRATION_TOKEN:-secops-switch-token-2026}
      - SECRET_KEYS=${SWITCH_SECRET_KEYS:-k1:secops_master_secret_key_32_chars_min_12345678}
      - GATEWAY_COOKIE_SECURE=false
      - GATEWAY_ADMIN_EMAIL=${SWITCH_ADMIN_EMAIL:-admin@kite-secops.local}
      - GATEWAY_ADMIN_PASSWORD=${SWITCH_ADMIN_PASS:-SecOpsAdminPass2026!}
      - FRONTEND_BASE_URL=http://localhost:3000
      - GATEWAY_PUBLIC_URL=http://localhost:8080
      - MESSAGING_PUBLIC_URL=http://localhost:8080
      - DISCORD_APP_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_APP_APPLICATION_ID=${DISCORD_APP_APPLICATION_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - secops-net

volumes:
  pgdata:
  redisdata:

networks:
  secops-net:
    driver: bridge
