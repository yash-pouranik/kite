services:
  # ── Core Gateway, Switch Protocol & Multi-Agent Discord Runtime ──
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: kite-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME}
      - HOST_REPO_PATH=${HOST_REPO_PATH:-/home/ubuntu/mcp-gateway-k8s}
      - TARGET_HOST=${TARGET_HOST:-vynn.urbackend.in}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://secops:secops_secure_pass@postgres:5432/cyberwar
    volumes:
      # Live sync gateway code on host git pull
      - ./gateway:/app
      # Host source code repo mount (for native git commands on target repo)
      - ${HOST_REPO_PATH:-/home/ubuntu/mcp-gateway-k8s}:/app/target_repo
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - postgres
      - sec-tools
    networks:
      - secops-net

  # ── PostgreSQL Persistent State ──
  postgres:
    image: postgres:16-alpine
    container_name: kite-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=secops
      - POSTGRES_PASSWORD=secops_secure_pass
      - POSTGRES_DB=cyberwar
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./gateway/db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    networks:
      - secops-net

  # ── Redis Ephemeral State ──
  redis:
    image: redis:7-alpine
    container_name: kite-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - secops-net

  # ── Sandboxed Security Tools (Nmap + Nuclei CLI) ──
  sec-tools:
    build:
      context: ./sandbox/tools
      dockerfile: Dockerfile.tools
    container_name: kite-sec-tools
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      - secops-net

volumes:
  pgdata:
  redisdata:

networks:
  secops-net:
    driver: bridge
